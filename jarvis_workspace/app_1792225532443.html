<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J.A.R.V.I.S. Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#3b82f6',
            secondary: '#6366f1',
          },
          animation: {
            fadeIn: 'fadeIn 0.3s ease-out forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
          },
        },
      },
    };
  </script>
  <style>
    body {
      @apply bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">
  <!-- Header -->
  <header class="flex items-center justify-between p-4 bg-white dark:bg-gray-800 shadow-md">
    <h1 class="text-2xl font-semibold text-primary">J.A.R.V.I.S.</h1>
    <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 focus:outline-none">
      <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-800 dark:text-gray-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path id="sunIcon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m8.66-9.66h-1M4.34 12.34h-1m15.02 5.66l-.71-.71M6.34 6.34l-.71-.71m12.02 12.02l-.71-.71M6.34 17.66l-.71-.71M12 5a7 7 0 100 14 7 7 0 000-14z" />
        <path id="moonIcon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z" class="hidden" />
      </svg>
    </button>
  </header>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto p-4">
    <section class="max-w-2xl mx-auto">
      <!-- Conversation Log -->
      <div id="log" class="space-y-4 mb-6"></div>

      <!-- Input Panel -->
      <div class="flex flex-col sm:flex-row gap-2">
        <textarea id="commandInput" rows="2" placeholder="Ask J.A.R.V.I.S...." class="flex-1 p-3 rounded-lg bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 focus:outline-none focus:ring-2 focus:ring-primary resize-none"></textarea>
        <div class="flex gap-2">
          <button id="voiceBtn" class="flex items-center justify-center px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/80 focus:outline-none transition-colors" title="Voice Input">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14a3 3 0 003-3V5a3 3 0 10-6 0v6a3 3 0 003 3z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11v2a7 7 0 01-14 0v-2" />
            </svg>
            <span class="hidden sm:inline">Speak</span>
          </button>
          <button id="sendBtn" class="flex items-center justify-center px-4 py-2 bg-secondary text-white rounded-lg hover:bg-secondary/80 focus:outline-none transition-colors" title="Send Command">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7-7 7M5 5l7 7-7 7" />
            </svg>
            <span class="hidden sm:inline">Send</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="p-4 text-center text-sm text-gray-500 dark:text-gray-400">
    © 2026 J.A.R.V.I.S. Demo
  </footer>

  <script>
    // Theme handling
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    const setTheme = (dark) => {
      document.documentElement.classList.toggle('dark', dark);
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      sunIcon.classList.toggle('hidden', dark);
      moonIcon.classList.toggle('hidden', !dark);
    };

    const initTheme = () => {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(saved ? saved === 'dark' : prefersDark);
    };

    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.classList.contains('dark');
      setTheme(!isDark);
    });

    initTheme();

    // Speech Recognition
    const voiceBtn = document.getElementById('voiceBtn');
    const commandInput = document.getElementById('commandInput');
    const sendBtn = document.getElementById('sendBtn');
    const log = document.getElementById('log');

    const addMessage = (text, fromUser = true) => {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'animate-fadeIn';
      msgDiv.innerHTML = `
        <div class="${fromUser ? 'text-right' : 'text-left'}">
          <span class="${fromUser ? 'bg-primary text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-gray-100'} inline-block rounded-lg px-4 py-2 max-w-xs break-words">
            ${text}
          </span>
        </div>
      `;
      log.appendChild(msgDiv);
      log.scrollTop = log.scrollHeight;
    };

    const mockFetchResponse = (query) => {
      // Simulate processing delay and return a dummy answer
      return new Promise((resolve) => {
        setTimeout(() => {
          resolve({ answer: `You said: "${query}". This is a mock response.` });
        }, 1200);
      });
    };

    const handleCommand = async () => {
      const query = commandInput.value.trim();
      if (!query) return;
      addMessage(query, true);
      commandInput.value = '';
      try {
        const response = await mockFetchResponse(query);
        addMessage(response.answer, false);
      } catch (e) {
        addMessage('Error processing your request.', false);
      }
    };

    sendBtn.addEventListener('click', handleCommand);
    commandInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleCommand();
      }
    });

    // Voice input handling
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognizer = new SpeechRecognition();
      recognizer.continuous = false;
      recognizer.interimResults = false;
      recognizer.lang = 'en-US';

      voiceBtn.addEventListener('click', () => {
        recognizer.start();
        voiceBtn.disabled = true;
        voiceBtn.classList.add('opacity-50');
      });

      recognizer.addEventListener('result', (e) => {
        const transcript = Array.from(e.results)
          .map(r => r[0].transcript)
          .join(' ');
        commandInput.value = transcript;
        handleCommand();
      });

      recognizer.addEventListener('end', () => {
        voiceBtn.disabled = false;
        voiceBtn.classList.remove('opacity-50');
      });

      recognizer.addEventListener('error', (e) => {
        console.error('Speech recognition error:', e.error);
        voiceBtn.disabled = false;
        voiceBtn.classList.remove('opacity-50');
      });
    } else {
      voiceBtn.title = 'Speech Recognition not supported';
      voiceBtn.disabled = true;
      voiceBtn.classList.add('opacity-50');
    }
  </script>
</body>
</html>
